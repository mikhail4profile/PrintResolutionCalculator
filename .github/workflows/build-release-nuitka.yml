name: Build Windows exe (Nuitka experiment)

# Separate, manual-only workflow — does not touch releases or run
# automatically on tags, so it can't interfere with the existing
# PyInstaller-based build-release.yml pipeline. Trigger it by hand
# from the Actions tab to test the Nuitka build before adopting it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka

      - name: Build with Nuitka (standalone)
        run: >
          python -m nuitka
          --standalone
          --windows-console-mode=disable
          --windows-icon-from-ico=icon.ico
          --include-data-files=print-resolution-calculator.html=print-resolution-calculator.html
          --output-dir=dist_nuitka
          --output-filename=PrintResolutionCalculator.exe
          --assume-yes-for-downloads
          main.py

      - name: Zip the build output
        run: Compress-Archive -Path dist_nuitka\main.dist\* -DestinationPath dist_nuitka\PrintResolutionCalculator-nuitka.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintResolutionCalculator-nuitka
          path: dist_nuitka/PrintResolutionCalculator-nuitka.zip
