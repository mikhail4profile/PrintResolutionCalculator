name: Build and release Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PrintResolutionCalculator
          --add-data "print-resolution-calculator.html;."
          main.py

      - name: Upload build artifact (for manual runs / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: PrintResolutionCalculator-windows
          path: dist/PrintResolutionCalculator.exe

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrintResolutionCalculator.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
