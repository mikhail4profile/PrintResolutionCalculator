name: Build and release Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with Nuitka (standalone)
        run: >
          python -m nuitka
          --standalone
          --windows-console-mode=disable
          --windows-icon-from-ico=icon.ico
          --include-data-files=print-resolution-calculator.html=print-resolution-calculator.html
          --output-dir=dist_nuitka
          --output-filename=PrintResolutionCalculator.exe
          --assume-yes-for-downloads
          main.py

      - name: Zip the build output
        run: Compress-Archive -Path dist_nuitka\main.dist\* -DestinationPath dist_nuitka\PrintResolutionCalculator-windows.zip

      - name: Upload build artifact (for manual runs / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: PrintResolutionCalculator-windows
          path: dist_nuitka/PrintResolutionCalculator-windows.zip

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_nuitka/PrintResolutionCalculator-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
